name: NexLevel Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Android
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          target: Android64

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NexLevel-Android
          path: build/**/*.geode
          if-no-files-found: error
