name: Build NexLevel

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build Android Geode
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Build Geode
    id: build
    uses: geode-sdk/build-geode-mod@main
    with:
      sdk: latest
      target: Android64
      build-config: Release

  - name: Upload Geode
    uses: actions/upload-artifact@v4
    with:
      name: NexLevel-Android64
      path: ${{ steps.build.outputs.build-output }}
      if-no-files-found: error
