name: Build NexLevel

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build Android Geode
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v7

  - name: Build Geode mod
    id: build
    uses: geode-sdk/build-geode-mod@main
    with:
      sdk: latest
      target: Android64
      build-config: Release

  - name: Upload .geode file
    uses: actions/upload-artifact@v7
    with:
      name: NexLevel-Android64
      path: ${{ steps.build.outputs.build-output }}/*.geode
      if-no-files-found: error
